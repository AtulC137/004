<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice Event Assistant</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap');

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #00e5ff;
      --accent2: #7c3aed;
      --text: #e2e8f0;
      --muted: #4a5568;
      --speech: #00e5ff;
      --transcript: #a3e635;
      --ai: #f59e0b;
      --ai-dim: rgba(245,158,11,0.12);
      --error: #f87171;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .header p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.4rem;
      font-family: 'IBM Plex Mono', monospace;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 720px;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.connected   { background: var(--transcript); box-shadow: 0 0 6px var(--transcript); }
    .dot.listening   { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1s infinite; }
    .dot.speech      { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 0.5s infinite; }
    .dot.thinking    { background: var(--ai); box-shadow: 0 0 8px var(--ai); animation: pulse 0.7s infinite; }
    .dot.speaking    { background: #a855f7; box-shadow: 0 0 8px #a855f7; animation: pulse 0.8s infinite; }
    .dot.error       { background: var(--error); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Visualizer */
    .visualizer-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    #visualizer {
      width: 100%;
      height: 56px;
      border-radius: 6px;
      background: #0d0d15;
      border: 1px solid var(--border);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    button {
      flex: 1;
      padding: 0.75rem 1.2rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.15s;
    }
    #startBtn { background: var(--accent); color: #000; }
    #startBtn:hover:not(:disabled) { filter: brightness(1.15); }
    #startBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    #stopBtn { background: transparent; color: var(--error); border: 1px solid var(--error); }
    #stopBtn:hover:not(:disabled) { background: rgba(248,113,113,0.1); }
    #stopBtn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Two-panel layout */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 600px) {
      .panels { grid-template-columns: 1fr; }
    }

    .panel-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.70rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .panel-label .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
    }
    .badge-user  { background: rgba(163,230,53,0.15); color: var(--transcript); border: 1px solid rgba(163,230,53,0.3); }
    .badge-ai    { background: rgba(245,158,11,0.15); color: var(--ai);         border: 1px solid rgba(245,158,11,0.3); }

    .transcript-box {
      background: #0d0d15;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem;
      min-height: 220px;
      max-height: 340px;
      overflow-y: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.80rem;
      line-height: 1.65;
      scroll-behavior: smooth;
    }

    .t-line { margin-bottom: 0.35rem; }
    .t-user  { color: var(--transcript); }
    .t-user::before  { content: "YOU ▸ "; color: var(--muted); }
    .t-event { color: var(--accent); opacity: 0.6; font-size: 0.72rem; }
    .t-error { color: var(--error); }
    .t-placeholder { color: var(--muted); font-style: italic; }

    /* AI response panel */
    .ai-box {
      background: #0d0d15;
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 8px;
      padding: 0.9rem;
      min-height: 220px;
      max-height: 340px;
      overflow-y: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.80rem;
      line-height: 1.65;
      scroll-behavior: smooth;
    }

    .ai-turn {
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(245,158,11,0.1);
    }
    .ai-turn:last-child { border-bottom: none; margin-bottom: 0; }

    .ai-turn-label {
      font-size: 0.65rem;
      color: rgba(245,158,11,0.5);
      margin-bottom: 0.3rem;
      letter-spacing: 0.05em;
    }

    .ai-turn-text {
      color: var(--ai);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai-turn-text.streaming::after {
      content: '▌';
      animation: blink 0.6s step-end infinite;
      color: var(--ai);
      opacity: 0.8;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .ai-placeholder { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>

<div class="header">
  <h1>Voice Event Assistant</h1>
  <p>Adobe Exclusive Roundtable · Sarvam STT + LLM · ElevenLabs TTS · Hinglish</p>
</div>

<div class="card">
  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="statusText">Idle — click Start to begin</span>
  </div>

  <div class="visualizer-wrap">
    <canvas id="visualizer"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn">▶ Start</button>
    <button id="stopBtn" disabled>■ Stop</button>
  </div>

  <div class="panels">
    <div>
      <div class="panel-label">
        Live Transcript <span class="badge badge-user">YOU</span>
      </div>
      <div class="transcript-box" id="transcript">
        <div class="t-line t-placeholder">Aapki awaaz yahaan aayegi...</div>
      </div>
    </div>
    <div>
      <div class="panel-label">
        AI Response <span class="badge badge-ai">ASSISTANT</span>
      </div>
      <div class="ai-box" id="aiBox">
        <div class="ai-placeholder">AI ka jawab yahaan aayega...</div>
      </div>
    </div>
  </div>
</div>

<script>
  const WS_URL = 'ws://localhost:8000/ws/audio';
  const SAMPLE_RATE = 16000;
  const CHUNK_SIZE = 4096;

  const startBtn    = document.getElementById('startBtn');
  const stopBtn     = document.getElementById('stopBtn');
  const transcriptEl = document.getElementById('transcript');
  const aiBox       = document.getElementById('aiBox');
  const statusText  = document.getElementById('statusText');
  const dot         = document.getElementById('dot');

  let ws = null, audioCtx = null, mediaStream = null;
  let workletNode = null, sourceNode = null;
  let animFrameId = null, analyser = null;
  let firstTranscript = true;
  let firstAI = true;

  // Current streaming AI turn element
  let currentAiTurnEl = null;
  let currentAiTextEl = null;
  let currentAiBuffer = '';

  // ── TTS Audio Engine ───────────────────────────────────────────────────
  // Queues MP3 chunks from server, decodes + plays them in order via Web Audio.
  // Uses a chain of AudioBufferSourceNodes scheduled back-to-back for gapless playback.
  let ttsAudioCtx = null;       // Separate AudioContext for TTS playback
  let ttsNextStartTime = 0;     // When to schedule next audio chunk
  let ttsChunkBuffer = [];      // Raw MP3 byte accumulator
  let ttsPlaying = false;

  function getTtsAudioCtx() {
    if (!ttsAudioCtx || ttsAudioCtx.state === 'closed') {
      ttsAudioCtx = new AudioContext();
      ttsNextStartTime = 0;
    }
    return ttsAudioCtx;
  }

  // Accumulate incoming binary frames, then decode + schedule when we have enough data.
  // MP3 needs a minimum frame size to decode cleanly — we buffer until tts_end or 32KB.
  const TTS_DECODE_THRESHOLD = 32 * 1024; // 32KB — enough for ~1s of MP3 at 128kbps

  async function enqueueTtsChunk(arrayBuffer) {
    ttsChunkBuffer.push(new Uint8Array(arrayBuffer));
    const totalBytes = ttsChunkBuffer.reduce((s, c) => s + c.length, 0);
    if (totalBytes >= TTS_DECODE_THRESHOLD) {
      await flushTtsBuffer();
    }
  }

  async function flushTtsBuffer() {
    if (ttsChunkBuffer.length === 0) return;

    // Merge all buffered chunks into one ArrayBuffer
    const totalBytes = ttsChunkBuffer.reduce((s, c) => s + c.length, 0);
    const merged = new Uint8Array(totalBytes);
    let offset = 0;
    for (const chunk of ttsChunkBuffer) {
      merged.set(chunk, offset);
      offset += chunk.length;
    }
    ttsChunkBuffer = [];

    try {
      const ctx = getTtsAudioCtx();
      const audioBuffer = await ctx.decodeAudioData(merged.buffer);

      const source = ctx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(ctx.destination);

      // Schedule gapless: start exactly when previous chunk ends
      const now = ctx.currentTime;
      const startAt = Math.max(now + 0.05, ttsNextStartTime); // 50ms buffer for scheduling
      source.start(startAt);
      ttsNextStartTime = startAt + audioBuffer.duration;
    } catch (err) {
      // Partial MP3 frames can fail to decode — silently skip
      console.warn('[TTS] Decode error (partial frame?):', err.message);
    }
  }

  function resetTtsEngine() {
    ttsChunkBuffer = [];
    ttsNextStartTime = 0;
    ttsPlaying = false;
  }

  // ── Canvas visualizer ──────────────────────────────────────────────────
  const canvas = document.getElementById('visualizer');
  const ctx2d  = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width  = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawIdle() {
    resizeCanvas();
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    const mid = canvas.height / 2;
    ctx2d.strokeStyle = '#1e1e2e';
    ctx2d.lineWidth = 1.5;
    ctx2d.beginPath();
    ctx2d.moveTo(0, mid);
    ctx2d.lineTo(canvas.width, mid);
    ctx2d.stroke();
  }
  drawIdle();

  function drawWaveform() {
    if (!analyser) return;
    animFrameId = requestAnimationFrame(drawWaveform);
    resizeCanvas();
    const bufLen = analyser.fftSize;
    const data   = new Float32Array(bufLen);
    analyser.getFloatTimeDomainData(data);
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    ctx2d.strokeStyle = '#00e5ff';
    ctx2d.lineWidth   = 1.5;
    ctx2d.shadowBlur  = 6;
    ctx2d.shadowColor = '#00e5ff44';
    ctx2d.beginPath();
    const sliceW = canvas.width / bufLen;
    let x = 0;
    for (let i = 0; i < bufLen; i++) {
      const y = (data[i] * 0.5 + 0.5) * canvas.height;
      i === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
      x += sliceW;
    }
    ctx2d.stroke();
    ctx2d.shadowBlur = 0;
  }

  // ── Status helpers ─────────────────────────────────────────────────────
  function setStatus(state, msg) {
    dot.className = 'dot ' + state;
    statusText.textContent = msg;
  }

  function addTranscriptLine(cls, text) {
    if (firstTranscript) {
      transcriptEl.innerHTML = '';
      firstTranscript = false;
    }
    const div = document.createElement('div');
    div.className = 't-line ' + cls;
    div.textContent = text;
    transcriptEl.appendChild(div);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  // ── AI streaming helpers ───────────────────────────────────────────────
  function startAiTurn() {
    if (firstAI) {
      aiBox.innerHTML = '';
      firstAI = false;
    }
    currentAiBuffer = '';

    const turn = document.createElement('div');
    turn.className = 'ai-turn';

    const label = document.createElement('div');
    label.className = 'ai-turn-label';
    label.textContent = 'ASSISTANT ▸';
    turn.appendChild(label);

    const textEl = document.createElement('div');
    textEl.className = 'ai-turn-text streaming';
    turn.appendChild(textEl);

    aiBox.appendChild(turn);
    aiBox.scrollTop = aiBox.scrollHeight;

    currentAiTurnEl = turn;
    currentAiTextEl = textEl;
  }

  function appendAiToken(token) {
    if (!currentAiTextEl) return;
    currentAiBuffer += token;
    currentAiTextEl.textContent = currentAiBuffer;
    aiBox.scrollTop = aiBox.scrollHeight;
  }

  function finalizeAiTurn(fullText) {
    if (currentAiTextEl) {
      currentAiTextEl.classList.remove('streaming');
      if (fullText) currentAiTextEl.textContent = fullText;
    }
    currentAiTurnEl = null;
    currentAiTextEl = null;
    currentAiBuffer = '';
  }

  // ── WebSocket message handler ──────────────────────────────────────────
  function handleMessage(evt) {
    // Binary frame = TTS audio chunk
    if (evt.data instanceof ArrayBuffer) {
      if (ttsPlaying) enqueueTtsChunk(evt.data);
      return;
    }

    let msg;
    try { msg = JSON.parse(evt.data); } catch (_) { return; }

    switch (msg.type) {
      case 'speech_start':
        setStatus('speech', 'Listening · Speech detected');
        addTranscriptLine('t-event', '── speech detected');
        break;

      case 'speech_end':
        setStatus('listening', 'Listening · Waiting for speech');
        addTranscriptLine('t-event', '── speech ended');
        break;

      case 'transcript':
        if (msg.text) addTranscriptLine('t-user', msg.text);
        break;

      case 'llm_start':
        setStatus('thinking', 'AI thinking...');
        startAiTurn();
        break;

      case 'llm_token':
        if (msg.token) appendAiToken(msg.token);
        break;

      case 'llm_end':
        setStatus('listening', 'Listening · Speak now');
        finalizeAiTurn(msg.text || '');
        break;

      case 'llm_error':
        setStatus('error', 'AI error');
        finalizeAiTurn('');
        if (currentAiTextEl) {
          currentAiTextEl.style.color = 'var(--error)';
          currentAiTextEl.textContent = msg.text || 'Error';
        }
        break;

      case 'tts_start':
        ttsPlaying = true;
        ttsChunkBuffer = [];
        // Reset scheduling so new response starts fresh
        if (ttsAudioCtx) ttsNextStartTime = ttsAudioCtx.currentTime;
        setStatus('speaking', 'AI speaking...');
        break;

      case 'tts_end':
        // Flush any remaining buffered bytes
        flushTtsBuffer().then(() => {
          ttsPlaying = false;
          setStatus('listening', 'Listening · Speak now');
        });
        break;
    }
  }

  // ── Start ──────────────────────────────────────────────────────────────
  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    stopBtn.disabled  = false;
    setStatus('', 'Connecting...');

    try {
      ws = new WebSocket(WS_URL);
      ws.binaryType = 'arraybuffer';

      ws.onopen    = () => { setStatus('connected', 'Connected · Starting mic...'); startMic(); };
      ws.onmessage = handleMessage;
      ws.onerror   = () => { setStatus('error', 'WebSocket error'); addTranscriptLine('t-error', 'WebSocket error'); cleanup(); };
      ws.onclose   = () => { if (!stopBtn.disabled) setStatus('', 'Disconnected'); cleanup(); };

    } catch (err) {
      setStatus('error', 'Failed: ' + err.message);
      addTranscriptLine('t-error', err.message);
      startBtn.disabled = false;
      stopBtn.disabled  = true;
    }
  });

  stopBtn.addEventListener('click', () => {
    cleanup();
    setStatus('', 'Stopped');
    startBtn.disabled = false;
    stopBtn.disabled  = true;
    drawIdle();
  });

  async function startMic() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, sampleRate: SAMPLE_RATE,
                 echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });

      audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
      await audioCtx.audioWorklet.addModule('/pcm-processor.js');

      sourceNode = audioCtx.createMediaStreamSource(mediaStream);
      analyser   = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      sourceNode.connect(analyser);

      workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor', {
        processorOptions: { chunkSize: CHUNK_SIZE }
      });

      workletNode.port.onmessage = (e) => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data.buffer);
      };

      sourceNode.connect(workletNode);
      workletNode.connect(audioCtx.destination);

      setStatus('listening', 'Listening · Speak now');
      drawWaveform();

    } catch (err) {
      setStatus('error', 'Mic error: ' + err.message);
      addTranscriptLine('t-error', 'Mic error: ' + err.message);
      cleanup();
      startBtn.disabled = false;
      stopBtn.disabled  = true;
    }
  }

  function cleanup() {
    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    if (workletNode) { workletNode.disconnect(); workletNode = null; }
    if (sourceNode)  { sourceNode.disconnect(); sourceNode = null; }
    analyser = null;
    if (audioCtx)    { audioCtx.close(); audioCtx = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (ws && ws.readyState === WebSocket.OPEN) { ws.close(); ws = null; }
    if (ttsAudioCtx) { ttsAudioCtx.close(); ttsAudioCtx = null; }
    resetTtsEngine();
    finalizeAiTurn('');
  }
</script>
</body>
</html>
