<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice Event Assistant</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap');

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #00e5ff;
      --accent2: #7c3aed;
      --text: #e2e8f0;
      --muted: #4a5568;
      --speech: #00e5ff;
      --transcript: #a3e635;
      --error: #f87171;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .header p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.4rem;
      font-family: 'IBM Plex Mono', monospace;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 680px;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.connected { background: var(--transcript); box-shadow: 0 0 6px var(--transcript); }
    .dot.listening { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1s infinite; }
    .dot.speech { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: pulse 0.5s infinite; }
    .dot.error { background: var(--error); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Visualizer */
    .visualizer-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    #visualizer {
      width: 100%;
      height: 60px;
      border-radius: 6px;
      background: #0d0d15;
      border: 1px solid var(--border);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    button {
      flex: 1;
      padding: 0.75rem 1.2rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.15s;
    }
    #startBtn {
      background: var(--accent);
      color: #000;
    }
    #startBtn:hover:not(:disabled) { filter: brightness(1.15); }
    #startBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    #stopBtn {
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
    }
    #stopBtn:hover:not(:disabled) { background: rgba(248,113,113,0.1); }
    #stopBtn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Transcript area */
    .transcript-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    #transcript {
      background: #0d0d15;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      min-height: 180px;
      max-height: 320px;
      overflow-y: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.6;
    }
    .t-line { margin-bottom: 0.3rem; }
    .t-user { color: var(--transcript); }
    .t-user::before { content: "USER ▸ "; color: var(--muted); }
    .t-event { color: var(--accent); }
    .t-event::before { content: "──  "; color: var(--border); }
    .t-error { color: var(--error); }
    .t-placeholder { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>

<div class="header">
  <h1>Voice Event Assistant</h1>
  <p>Streaming STT · Sarvam Saaras v3 · Real-time</p>
</div>

<div class="card">
  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="statusText">Idle — click Start to begin</span>
  </div>

  <div class="visualizer-wrap">
    <canvas id="visualizer"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn">▶ Start</button>
    <button id="stopBtn" disabled>■ Stop</button>
  </div>

  <div class="transcript-label">Live Transcript</div>
  <div id="transcript">
    <div class="t-line t-placeholder">Transcript will appear here...</div>
  </div>
</div>

<script>
  const WS_URL = 'ws://localhost:8000/ws/audio';
  const SAMPLE_RATE = 16000;
  const CHUNK_SIZE = 4096; // samples per worklet message

  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const transcriptEl = document.getElementById('transcript');
  const statusText = document.getElementById('statusText');
  const dot = document.getElementById('dot');

  let ws = null;
  let audioCtx = null;
  let mediaStream = null;
  let workletNode = null;
  let sourceNode = null;
  let animFrameId = null;
  let analyser = null;
  let firstTranscript = true;

  // --- Visualizer ---
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawIdle() {
    resizeCanvas();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const mid = canvas.height / 2;
    ctx.strokeStyle = '#1e1e2e';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, mid);
    ctx.lineTo(canvas.width, mid);
    ctx.stroke();
  }
  drawIdle();

  function drawWaveform() {
    if (!analyser) return;
    animFrameId = requestAnimationFrame(drawWaveform);
    resizeCanvas();
    const bufLen = analyser.fftSize;
    const data = new Float32Array(bufLen);
    analyser.getFloatTimeDomainData(data);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#00e5ff44';
    ctx.beginPath();

    const sliceW = canvas.width / bufLen;
    let x = 0;
    for (let i = 0; i < bufLen; i++) {
      const y = (data[i] * 0.5 + 0.5) * canvas.height;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      x += sliceW;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // --- Status helpers ---
  function setStatus(state, msg) {
    dot.className = 'dot ' + state;
    statusText.textContent = msg;
  }

  function addLine(cls, text) {
    if (firstTranscript) {
      transcriptEl.innerHTML = '';
      firstTranscript = false;
    }
    const div = document.createElement('div');
    div.className = 't-line ' + cls;
    div.textContent = text;
    transcriptEl.appendChild(div);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  // --- Main streaming logic ---
  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    stopBtn.disabled = false;
    setStatus('', 'Connecting...');

    try {
      // 1. Connect WebSocket
      ws = new WebSocket(WS_URL);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        setStatus('connected', 'Connected · Starting mic...');
        startMic();
      };

      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'speech_start') {
            setStatus('speech', 'Listening · Speech detected');
            addLine('t-event', 'Speech detected');
          } else if (msg.type === 'speech_end') {
            setStatus('listening', 'Listening · Waiting for speech');
            addLine('t-event', 'Speech ended');
          } else if (msg.type === 'transcript' && msg.text) {
            addLine('t-user', msg.text);
          }
        } catch (_) {}
      };

      ws.onerror = () => {
        setStatus('error', 'WebSocket error');
        addLine('t-error', 'WebSocket connection error');
        cleanup();
      };

      ws.onclose = () => {
        if (stopBtn.disabled === false) {
          setStatus('', 'Disconnected');
        }
        cleanup();
      };

    } catch (err) {
      setStatus('error', 'Failed: ' + err.message);
      addLine('t-error', err.message);
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }
  });

  stopBtn.addEventListener('click', () => {
    cleanup();
    setStatus('', 'Stopped');
    startBtn.disabled = false;
    stopBtn.disabled = true;
    drawIdle();
  });

  async function startMic() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          sampleRate: SAMPLE_RATE,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
      await audioCtx.audioWorklet.addModule('/pcm-processor.js');

      sourceNode = audioCtx.createMediaStreamSource(mediaStream);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      sourceNode.connect(analyser);

      workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor', {
        processorOptions: { chunkSize: CHUNK_SIZE }
      });

      workletNode.port.onmessage = (e) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          // e.data is Int16Array
          ws.send(e.data.buffer);
        }
      };

      sourceNode.connect(workletNode);
      workletNode.connect(audioCtx.destination);

      setStatus('listening', 'Listening · Speak now');
      drawWaveform();

    } catch (err) {
      setStatus('error', 'Mic error: ' + err.message);
      addLine('t-error', 'Mic error: ' + err.message);
      cleanup();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }
  }

  function cleanup() {
    if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    if (workletNode) { workletNode.disconnect(); workletNode = null; }
    if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
    analyser = null;
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (ws && ws.readyState === WebSocket.OPEN) { ws.close(); ws = null; }
  }
</script>
</body>
</html>
